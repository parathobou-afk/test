<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อสุ่มชื่อ</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;padding:16px;background:#f6f7fb;color:#18202a}.app{max-width:1050px;margin:auto}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #ddd;border-radius:18px;padding:18px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}select,input,button{font:inherit;min-height:44px;border-radius:10px;border:1px solid #d8dce4;padding:8px 11px}button{cursor:pointer}#names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.name{background:white}.name.on{background:#222;color:white;font-weight:700}.add{display:flex;gap:8px;margin-top:14px}.add input{flex:1;min-width:0}.primary{background:#222;color:white;font-weight:800}.spin{width:100%;font-size:18px;margin-top:12px}.spin:disabled{opacity:.35}.wheelwrap{position:relative;max-width:430px;margin:auto}.pointer{position:absolute;z-index:2;left:50%;top:0;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #111}canvas{display:block;width:100%;height:auto}.result{margin-top:12px;padding:14px;border-radius:12px;background:#f1f3f7;text-align:center;font-weight:800}.small{font-size:14px;color:#6b7280}.option{display:flex;gap:8px;align-items:center;margin-top:12px}.option input{min-height:auto;width:20px;height:20px}@media(max-width:780px){.layout{grid-template-columns:1fr}#names{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><main class="app"><h1>🎡 วงล้อสุ่มชื่อ</h1><p class="small">เลือกจำนวนคนในวงล้อได้ตั้งแต่ 2–30 คน</p><div class="layout"><section class="panel"><div class="row"><div><b>จำนวนคนในวงล้อ</b><div id="count" class="small"></div></div><div><select id="target"></select> <button id="clear">ล้าง</button></div></div><div id="names"></div><div id="note" class="small" style="margin-top:10px"></div><div class="add"><input id="newName" maxlength="24" placeholder="เพิ่มชื่อใหม่..."><button id="addName" class="primary">+ เพิ่ม</button></div></section><section class="panel"><div class="wheelwrap"><div class="pointer"></div><canvas id="wheel" width="760" height="760"></canvas></div><button id="spin" class="primary spin" disabled>🎡 หมุนวงล้อ</button><div id="result" class="result">เลือกชื่อให้ครบก่อน</div><label class="option"><input id="removeWinner" type="checkbox"> เอาคนที่สุ่มได้ออกจากวงล้อรอบถัดไป</label></section></div></main>
<script>
const initial=["แฟ้ง","บิ๊ก","อ๊อบ","แนค","ไผ่","ซัน","ฟอร์ดสุดหล่อ","โอม","พูม","อั๋น","เจ","แจ็คกี้","เม่น","อุ้ม","ปอนด์","Max","ข้าวก้อง","ไตเติ้ล","เสือ","ต่อ","บอส","ปลั๊ก","โบ๊ต","นพ","หนึ่ง","เติ้ล"];
let people=[...initial],selected=[],target=4,angle=0,busy=false;
const $=s=>document.querySelector(s),names=$("#names"),count=$("#count"),note=$("#note"),spin=$("#spin"),result=$("#result"),targetEl=$("#target"),canvas=$("#wheel"),ctx=canvas.getContext("2d");
for(let i=2;i<=30;i++){let o=document.createElement("option");o.value=i;o.textContent=i+" คน";o.selected=i===4;targetEl.appendChild(o)}
function render(){names.innerHTML="";people.forEach(n=>{let b=document.createElement("button");b.className="name"+(selected.includes(n)?" on":"");b.textContent=n;b.disabled=busy;b.onclick=()=>toggle(n);names.appendChild(b)});count.textContent=`เลือกแล้ว ${selected.length} / ${target}`;spin.disabled=busy||selected.length!==target;draw()}
function toggle(n){if(selected.includes(n))selected=selected.filter(x=>x!==n);else if(selected.length<target)selected.push(n);else{note.textContent=`เลือกได้สูงสุด ${target} คน`;return}note.textContent="";result.textContent=selected.length===target?"พร้อมแล้ว! กดหมุนได้เลย 🎯":`เลือกอีก ${target-selected.length} คน`;render()}
targetEl.onchange=()=>{target=+targetEl.value;if(selected.length>target)selected=selected.slice(0,target);note.textContent=people.length<target?`มีรายชื่อ ${people.length} คน กรุณาเพิ่มอีก ${target-people.length} คน`:"";result.textContent=selected.length===target?"พร้อมแล้ว! กดหมุนได้เลย 🎯":`เลือกอีก ${target-selected.length} คน`;render()};
$("#clear").onclick=()=>{selected=[];note.textContent="";result.textContent="เลือกชื่อให้ครบก่อน";render()};
function add(){let n=$("#newName").value.trim();if(!n)return;if(people.some(x=>x.toLowerCase()===n.toLowerCase())){note.textContent="ชื่อนี้มีอยู่แล้ว";return}people.push(n);$("#newName").value="";note.textContent=`เพิ่ม “${n}” แล้ว`;render()}$("#addName").onclick=add;$("#newName").onkeydown=e=>{if(e.key==="Enter")add()};
const colors=["#4f6d7a","#b56a78","#5f8f73","#b88746","#6574a6","#a16f9d","#568b8c","#9b7752","#697d56","#8b6670","#56718f","#8a8154"];
function draw(){let C=380,R=356,list=selected.length?selected:Array(target).fill("?"),n=list.length,seg=2*Math.PI/n;ctx.clearRect(0,0,760,760);ctx.save();ctx.translate(C,C);for(let i=0;i<n;i++){let a0=angle+i*seg-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,a0+seg);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=n>18?2:4;ctx.stroke();if(n<=20){ctx.save();ctx.rotate(a0+seg/2);ctx.translate(R*.66,0);ctx.rotate(Math.PI/2);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`bold ${n<=6?32:n<=10?24:n<=15?18:14}px system-ui`;let t=list[i],lim=n<=8?12:n<=14?9:7;ctx.fillText(t.length>lim?t.slice(0,lim)+"…":t,0,0);ctx.restore()}}ctx.beginPath();ctx.arc(0,0,55,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();ctx.fillStyle="#111";ctx.font="bold 23px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("GO",0,1);ctx.restore()}
spin.onclick=()=>{if(selected.length!==target||busy)return;busy=true;render();result.textContent="กำลังหมุน... 🎡";let n=selected.length,w=Math.floor(Math.random()*n),seg=2*Math.PI/n;
/* FIXED: center of winner segment lands exactly under the 12 o'clock pointer */
let ta=-(w*seg+seg/2),d=((ta-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),total=d+2*Math.PI*(6+Math.floor(Math.random()*3)),start=angle,t0=performance.now();
function anim(t){let p=Math.min(1,(t-t0)/4500),e=1-Math.pow(1-p,4);angle=start+total*e;draw();if(p<1)requestAnimationFrame(anim);else{angle%=2*Math.PI;let win=selected[w];busy=false;result.textContent=`🎉 ได้ ${win}!`;if($("#removeWinner").checked){selected=selected.filter(x=>x!==win);target=Math.max(2,target-1);targetEl.value=target;note.textContent=`เอา ${win} ออกจากรอบถัดไปแล้ว`}render()}}requestAnimationFrame(anim)};
render();
</script></body></html>
